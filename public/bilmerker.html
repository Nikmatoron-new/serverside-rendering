<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>

 <title>bilmerker</title>

</head>
   
<ul id="bilmerker">
    <li>Henter data...</li>
</ul>

<script>
    fetch('/bilmerker-json')
    .then( response => response.json() )
    .then(data => {
        let list = document.getElementById('bilmerker');
        list.innerHTML = '';
        data.forEach(row => {
            let li = document.createElement('li');
            li.textContent = row.name;
            list.appendChild(li);
        });
    });
</script>




</html>
